<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			globalThis.litIssuedWarnings ??= new Set();
			globalThis.litIssuedWarnings.add('dev-mode');
			globalThis.litIssuedWarnings.add(
				'Lit is in dev mode. Not recommended for production! See https://lit.dev/msg/dev-mode for more information.'
			);
		</script>
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="MyWebSite" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<script type="module">
			const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
			const applyDark = function (event = systemDark) {
				const isDark = event.matches;
				document.documentElement.classList.toggle('wa-dark', isDark);
			};
			systemDark.addEventListener('change', applyDark);
			applyDark();
		</script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
